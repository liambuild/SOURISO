name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Chaîne Rust (version épinglée par rust-toolchain.toml)
        run: rustup show
      - name: Frontière système
        shell: bash
        run: ./scripts/verifier-frontiere.sh
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Compilation
        run: cargo build --release --locked
      - name: Conserver l'exécutable (7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: souriso-${{ runner.os }}
          path: |
            target/release/souriso
            target/release/souriso.exe
          if-no-files-found: error
          retention-days: 7
