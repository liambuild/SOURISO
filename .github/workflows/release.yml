name: Release

# Ne se déclenche que lorsqu'un tag de version (v0.1.0) est poussé, par le propriétaire du dépôt.
# Ni cette CI ni l'assistant ne créent de tag. Le tag doit désigner un commit de `main` dont la CI
# est verte. La version du tag doit concorder avec celle du dépôt (scripts/version.sh).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installateurs:
    name: Installateurs
    uses: ./.github/workflows/installateurs.yml
    with:
      tag: ${{ github.ref_name }}

  publier:
    name: Publier la release
    needs: installateurs
    runs-on: ubuntu-latest
    # Seul job du dépôt qui reçoit le droit d'écrire dans les contenus.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installateur-*
          merge-multiple: true
          path: installateurs
      - name: Empreintes
        working-directory: installateurs
        run: sha256sum SOURISO-* > SHA256SUMS.txt
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" installateurs/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SOURISO $TAG" \
            --generate-notes \
            --notes "Installateurs non signés : voir docs/INSTALLATION.md pour passer l'avertissement SmartScreen (Windows) et le blocage Gatekeeper (macOS, Apple Silicon uniquement)."
