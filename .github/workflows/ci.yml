name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Chaîne Rust (version épinglée par rust-toolchain.toml)
        run: rustup show
      - name: Frontière système
        shell: bash
        run: ./scripts/verifier-frontiere.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Compilation (les deux exécutables)
        run: cargo build --release --locked --workspace
      - name: Conserver les exécutables (7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: souriso-${{ runner.os }}
          # Les deux exécutables, côte à côte à la racine de l'archive : `souriso` cherche
          # `souriso-reglages` dans son propre dossier.
          path: |
            target/release/souriso
            target/release/souriso.exe
            target/release/souriso-reglages
            target/release/souriso-reglages.exe
          if-no-files-found: error
          retention-days: 7

  installateurs:
    name: Installateurs
    needs: verifier
    # Construit les installateurs comme artefacts de la PR : aucune release, aucun droit d'écriture.
    uses: ./.github/workflows/installateurs.yml
